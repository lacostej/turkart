[project]
name = "turkart"
version = "0.1.0"
description = "Turn a hand-picked set of Strava rides into a printable map poster."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
turkart = "turkart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turkart"]
